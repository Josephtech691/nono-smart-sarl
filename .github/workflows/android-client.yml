# Construit l'application Android « Fresh Fish — clients » dans le cloud de GitHub (aucun PC ni Android Studio requis).
# Lancement : onglet « Actions » du dépôt > « Android clients » > « Run workflow ».
# Résultats (en bas de la page de l'exécution, section « Artifacts ») :
#   - fresh-fish-clients-debug-apk : APK à installer directement sur un téléphone pour tester ;
#   - fresh-fish-clients-aab       : fichier .aab signé, à envoyer sur Google Play (si la clé de signature est configurée).
name: Android clients

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Nom de version affiché (ex. 1.0.0)"
        default: "1.0.0"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Construire le site clients (même code que le site)
        working-directory: frontend
        run: |
          npm install
          npm run build:client

      - name: Préparer l'application (site + couche native)
        working-directory: native-client
        run: |
          npm install
          npm run prepare-web

      - name: Créer le projet Android
        working-directory: native-client
        run: npx cap add android

      - name: Icônes, écran de démarrage et réglages Android
        working-directory: native-client
        run: |
          npx capacitor-assets generate --android
          python3 scripts/patch-android.py "${{ github.run_number }}" "${{ inputs.version }}"

      - name: Firebase (notifications push)
        working-directory: native-client
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 absent : l'application fonctionnera mais sans notifications push."
          fi

      - name: Synchroniser Capacitor
        working-directory: native-client
        run: npx cap sync android

      - name: Compiler (APK de test + AAB pour Google Play)
        working-directory: native-client/android
        run: ./gradlew --no-daemon assembleDebug bundleRelease

      - name: Signer l'AAB (clé d'envoi Google Play)
        working-directory: native-client/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Clé de signature absente : AAB non signé (inutilisable sur Google Play)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          echo "SIGNED=1" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: fresh-fish-clients-debug-apk
          path: native-client/android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: env.SIGNED == '1'
        with:
          name: fresh-fish-clients-aab
          path: native-client/android/app/build/outputs/bundle/release/app-release.aab
